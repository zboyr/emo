# 在自托管 Runner 上部署并运行本站点
# 需在仓库 Settings → Secrets and variables → Actions 中添加 OPENAI_API_KEY
# 需在你的服务器上注册 self-hosted runner 并打上 label: self-hosted
name: Deploy on Self-Hosted Runner

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: self-hosted
    env:
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      PORT: "13942"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Stop old instance (if any)
        run: |
          pkill -f "gunicorn.*app:app" || true
          sleep 2

      - name: Start app (gunicorn, detached from job)
        run: |
          cd $GITHUB_WORKSPACE
          setsid nohup gunicorn \
            --bind 0.0.0.0:${PORT} \
            --workers 2 \
            --timeout 120 \
            --access-logfile gunicorn-access.log \
            --error-logfile gunicorn-error.log \
            --pid gunicorn.pid \
            app:app \
            >> gunicorn.log 2>&1 &
          disown
          sleep 2
          if [ -f gunicorn.pid ]; then
            echo "Gunicorn PID: $(cat gunicorn.pid)"
          fi

      - name: Health check
        run: |
          curl -sf http://localhost:${PORT}/ > /dev/null || (echo "Response:"; curl -v http://localhost:${PORT}/ 2>&1; echo "Process on port:"; lsof -i :${PORT} || true; echo "Log tail:"; tail -30 gunicorn.log 2>/dev/null || true; exit 1)
          echo "✅ Site is up on port ${PORT}"
