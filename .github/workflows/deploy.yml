# 在自托管 Runner 上通过 systemd 系统服务部署并常驻运行
# 需在仓库 Settings → Secrets and variables → Actions 中添加 OPENAI_API_KEY
# 需在服务器上注册 self-hosted runner (label: self-hosted)
# Runner 用户需具备无密码 sudo，用于安装/重启 systemd 服务
name: Deploy on Self-Hosted Runner

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: self-hosted
    env:
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      PORT: "13942"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Deploy to fixed directory
        run: |
          DEPLOY_DIR="$HOME/emo"
          mkdir -p "$DEPLOY_DIR"
          cp -r "$GITHUB_WORKSPACE"/. "$DEPLOY_DIR/"
          cd "$DEPLOY_DIR"
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          echo "OPENAI_API_KEY=$OPENAI_API_KEY" > emo.env
          echo "PORT=$PORT" >> emo.env

      - name: Install and start systemd system service
        run: |
          DEPLOY_DIR="$HOME/emo"
          sed -e "s|__DEPLOY_DIR__|$DEPLOY_DIR|g" -e "s|__RUNNER_USER__|$USER|g" \
            "$GITHUB_WORKSPACE/deploy/emo.service" | sudo tee /etc/systemd/system/emo.service > /dev/null
          sudo systemctl daemon-reload
          sudo systemctl enable emo
          sudo systemctl restart emo

      - name: Health check
        run: |
          sleep 3
          curl -sf http://localhost:${PORT}/ > /dev/null || (echo "--- service status ---"; sudo systemctl status emo --no-pager; exit 1)
          echo "✅ Site is up on port ${PORT}"
