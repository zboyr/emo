# 在 GitHub Runner 上直接部署并运行本站点
# 需在仓库 Settings → Secrets and variables → Actions 中添加 OPENAI_API_KEY
name: Deploy on Runner

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      PORT: "13942"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run app in background
        run: |
          nohup python app.py > app.log 2>&1 &
          echo "App started (PID: $!)"
          sleep 2
          curl -sf http://localhost:13942 > /dev/null && echo "✅ App is running on port 13942" || echo "❌ App failed to start"
        env:
          FLASK_ENV: production

      - name: Show app log
        if: always()
        run: cat app.log || true
