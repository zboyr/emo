# 在自托管 Runner 上部署并运行本站点
# 需在仓库 Settings → Secrets and variables → Actions 中添加 OPENAI_API_KEY
# 需在你的服务器上注册 self-hosted runner 并打上 label: self-hosted
name: Deploy on Self-Hosted Runner

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: self-hosted
    env:
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      PORT: "13942"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Stop old instance (if any)
        run: |
          pkill -f "gunicorn.*app:app" || true
          sleep 1

      - name: Start app (gunicorn, background)
        run: |
          nohup gunicorn \
            --bind 0.0.0.0:${PORT} \
            --workers 2 \
            --timeout 120 \
            --access-logfile gunicorn-access.log \
            --error-logfile gunicorn-error.log \
            --daemon \
            app:app

      - name: Health check
        run: |
          sleep 2
          curl -sf http://localhost:${PORT}/ > /dev/null
          echo "✅ Site is up on port ${PORT}"
