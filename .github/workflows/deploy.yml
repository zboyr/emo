# 部署到 shawarmai.com（SSH + rsync）
# 请在仓库 Settings → Secrets and variables → Actions 中添加：
#   SSH_PRIVATE_KEY - 用于 root@shawarmai.com 的 SSH 私钥（完整内容，含 -----BEGIN ... END-----）
name: Deploy to shawarmai.com

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  REMOTE_HOST: shawarmai.com
  REMOTE_USER: root
  REMOTE_PATH: /var/www/stable_emo

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup SSH key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H ${{ env.REMOTE_HOST }} >> ~/.ssh/known_hosts 2>/dev/null || true

      - name: Rsync to server
        run: |
          rsync -avz --delete \
            --exclude '.git' \
            --exclude '.venv' \
            --exclude '__pycache__' \
            --exclude '*.pyc' \
            --exclude '.github' \
            -e "ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no" \
            ./ ${{ env.REMOTE_USER }}@${{ env.REMOTE_HOST }}:${{ env.REMOTE_PATH }}/

      - name: Install deps and restart on server
        env:
          REMOTE_PATH: ${{ env.REMOTE_PATH }}
        run: |
          ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no \
            ${{ env.REMOTE_USER }}@${{ env.REMOTE_HOST }} "cd ${{ env.REMOTE_PATH }} && \
            python3 -m venv .venv 2>/dev/null || true && \
            .venv/bin/pip install -r requirements.txt -q && \
            pkill -f 'gunicorn.*app:app' 2>/dev/null || true; \
            nohup .venv/bin/gunicorn -w 1 -b 0.0.0.0:13942 app:app >> /tmp/stable_emo.log 2>&1 &"

      - name: Deploy done
        run: echo "Deployed to ${{ env.REMOTE_USER }}@${{ env.REMOTE_HOST }}:${{ env.REMOTE_PATH }}"
